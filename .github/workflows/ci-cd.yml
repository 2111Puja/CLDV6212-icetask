name: CI/CD - Build, Test, Scan & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PROJECT: "Community Portal/Community Portal.csproj"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore "$PROJECT"

      - name: Build
        run: dotnet build "$PROJECT" --no-restore -c Release

      - name: Run tests (if a test project exists)
        run: |
          if ls **/*Tests.csproj >/dev/null 2>&1; then dotnet test --no-restore -c Release; else echo "No test project found - skipping."; fi
        shell: bash

  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check NuGet packages for known vulnerabilities
        run: |
          dotnet restore "$PROJECT"
          dotnet list "$PROJECT" package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then echo "Vulnerable packages found"; exit 1; fi

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f "Community Portal/Dockerfile" -t community-portal:${{ github.sha }} .

  deploy:
    runs-on: ubuntu-latest
    needs: [ build-and-test, security-scan, docker-build ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret not set - Render auto-deploy from GitHub will be used."
          else
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
          fi
